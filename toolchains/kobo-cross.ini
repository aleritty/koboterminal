# Example Meson cross file for Kobo ARM hard-float toolchains.
# Update binaries and paths for your local cross toolchain.

[binaries]
c = '/opt/x-tools/arm-kobo-linux-gnueabihf/bin/arm-kobo-linux-gnueabihf-gcc'
ar = '/opt/x-tools/arm-kobo-linux-gnueabihf/bin/arm-kobo-linux-gnueabihf-ar'
strip = '/opt/x-tools/arm-kobo-linux-gnueabihf/bin/arm-kobo-linux-gnueabihf-strip'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[properties]
needs_exe_wrapper = true
