[binaries]
c = 'arm-nickel-linux-gnueabihf-gcc'
cpp = 'arm-nickel-linux-gnueabihf-g++'
ar = 'arm-nickel-linux-gnueabihf-ar'
strip = 'arm-nickel-linux-gnueabihf-strip'
pkg-config = 'arm-nickel-linux-gnueabihf-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[properties]
needs_exe_wrapper = true
