# Branches and MRs: test + build, KoboRoot(-uninstall).tgz kept as a job artifact for 30 days.
# Tags v*: same, the artifact never expires, and a GitLab release links to it.
stages: [test, build, release]

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends g++ make pkg-config qtbase5-dev
  script:
    - tests/run.sh

.build:
  stage: build
  image: ghcr.io/pgaskin/nickeltc:1.0
  variables:
    GIT_DEPTH: 0 # git describe needs history and tags
  script:
    - make all strip koboroot koboroot-uninstall
    - echo "BUILD_JOB_ID=$CI_JOB_ID" > build.env
  artifacts:
    paths: [KoboRoot.tgz, KoboRoot-uninstall.tgz]
    reports:
      dotenv: build.env

build:
  extends: .build
  rules:
    - if: $CI_COMMIT_TAG !~ /^v/
  artifacts:
    expire_in: 30 days

build-release:
  extends: .build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  artifacts:
    expire_in: never

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - job: build-release
      artifacts: true
    - job: test
  script:
    - echo "Releasing $CI_COMMIT_TAG (build job $BUILD_JOB_ID)"
  release:
    tag_name: $CI_COMMIT_TAG
    name: KoboTerminal $CI_COMMIT_TAG
    description: Copy KoboRoot.tgz to KOBOeReader/.kobo/ and reboot.
    assets:
      links:
        - name: KoboRoot.tgz
          url: $CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID/artifacts/raw/KoboRoot.tgz
          link_type: package
        - name: KoboRoot-uninstall.tgz
          url: $CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID/artifacts/raw/KoboRoot-uninstall.tgz
          link_type: package
