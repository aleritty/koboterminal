# Branch pushes and PRs: test + build, KoboRoot(-uninstall).tgz kept as a workflow artifact.
# Tags v*: same, then a GitHub release with both KoboRoot archives (prerelease if the tag has a '-').
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qtbase5-dev
      - run: tests/run.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs history and tags
      - run: scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: koboterminal-${{ github.sha }} # branch names may contain "/", not allowed here
          path: |
            KoboRoot.tgz
            KoboRoot-uninstall.tgz
            THIRD_PARTY_NOTICES.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: scripts/release-notes.sh "${{ github.ref_name }}" > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          name: koboterminal-${{ github.sha }}
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            KoboRoot.tgz
            KoboRoot-uninstall.tgz
            THIRD_PARTY_NOTICES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md # CHANGELOG.md section + how to install
